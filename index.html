<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Student Management System</h1>
            <p>Manage student records easily</p>
        </header>

        <section class="card">
            <h2 id="formTitle">Add Student</h2>

            <form id="studentForm">
                <input type="hidden" id="editIndex">

                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId"
                           placeholder="Enter student ID" required>
                </div>

                <div class="form-group">
                    <label for="name">Student Name</label>
                    <input type="text" id="name"
                           placeholder="Enter student name" required>
                </div>

                <div class="form-group">
                    <label for="course">Course</label>
                    <input type="text" id="course"
                           placeholder="Enter course" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email"
                           placeholder="Enter email address" required>
                </div>

                <button type="submit" id="submitBtn">
                    Add Student
                </button>
                <button type="button" id="cancelBtn"
                        class="cancel" hidden>
                    Cancel
                </button>
            </form>
        </section>

        <section class="card">
            <div class="table-header">
                <h2>Student Records</h2>
                <input type="search" id="search"
                       placeholder="Search students...">
            </div>

            <p id="studentCount">Total Students: 0</p>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Course</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTable">
                        <!-- Student records appear here -->
                    </tbody>
                </table>
            </div>

            <p id="emptyMessage">No students added yet.</p>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
